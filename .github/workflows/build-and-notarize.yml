name: Build and Notarize

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            suffix: ""
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            suffix: ""
          - os: windows-latest
            goos: windows
            goarch: amd64
            suffix: ".exe"
          - os: macos-latest
            goos: darwin
            goarch: amd64
            suffix: ""
          - os: macos-latest
            goos: darwin
            goarch: arm64
            suffix: ""

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Build binary
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
        CGO_ENABLED: 0
      run: |
        mkdir -p dist
        go build -ldflags "-w -s -X main.version=${{ github.ref_name }}" -o dist/git-log-analyzer-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }} .

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
        path: dist/

  notarize-macos:
    needs: build
    runs-on: macos-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - uses: actions/checkout@v4

    - name: Download macOS binaries
      uses: actions/download-artifact@v4
      with:
        pattern: binaries-darwin-*
        path: dist/
        merge-multiple: true

    - name: Import Code-Signing Certificates
      uses: Apple-Actions/import-codesign-certs@v3
      with:
        # Apple Developer证书，base64编码后存储在GitHub Secrets中
        p12-file-base64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
        p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

    - name: Sign macOS binaries
      env:
        APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
      run: |
        # 为AMD64版本签名
        if [ -f "dist/binaries-darwin-amd64/git-log-analyzer-darwin-amd64" ]; then
          codesign --force --options runtime --sign "Developer ID Application: ${APPLE_DEVELOPER_ID}" dist/binaries-darwin-amd64/git-log-analyzer-darwin-amd64
          echo "Signed AMD64 binary"
        fi
        
        # 为ARM64版本签名
        if [ -f "dist/binaries-darwin-arm64/git-log-analyzer-darwin-arm64" ]; then
          codesign --force --options runtime --sign "Developer ID Application: ${APPLE_DEVELOPER_ID}" dist/binaries-darwin-arm64/git-log-analyzer-darwin-arm64
          echo "Signed ARM64 binary"
        fi

    - name: Create ZIP archives for notarization
      run: |
        cd dist
        # 为每个已签名的二进制文件创建ZIP包
        if [ -f "binaries-darwin-amd64/git-log-analyzer-darwin-amd64" ]; then
          mkdir -p macos-amd64
          cp binaries-darwin-amd64/git-log-analyzer-darwin-amd64 macos-amd64/
          zip -r git-log-analyzer-macos-amd64.zip macos-amd64/
        fi
        
        if [ -f "binaries-darwin-arm64/git-log-analyzer-darwin-arm64" ]; then
          mkdir -p macos-arm64
          cp binaries-darwin-arm64/git-log-analyzer-darwin-arm64 macos-arm64/
          zip -r git-log-analyzer-macos-arm64.zip macos-arm64/
        fi

    - name: Notarize macOS binaries
      env:
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      run: |
        cd dist
        
        # 为AMD64版本进行公证
        if [ -f "git-log-analyzer-macos-amd64.zip" ]; then
          echo "Notarizing AMD64 version..."
          xcrun notarytool submit git-log-analyzer-macos-amd64.zip \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          
          # 装订公证票据
          xcrun stapler staple macos-amd64/git-log-analyzer-darwin-amd64
          echo "AMD64 notarization complete"
        fi
        
        # 为ARM64版本进行公证
        if [ -f "git-log-analyzer-macos-arm64.zip" ]; then
          echo "Notarizing ARM64 version..."
          xcrun notarytool submit git-log-analyzer-macos-arm64.zip \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          
          # 装订公证票据
          xcrun stapler staple macos-arm64/git-log-analyzer-darwin-arm64
          echo "ARM64 notarization complete"
        fi

    - name: Verify notarization
      run: |
        cd dist
        if [ -f "macos-amd64/git-log-analyzer-darwin-amd64" ]; then
          spctl -a -t exec -vv macos-amd64/git-log-analyzer-darwin-amd64
        fi
        if [ -f "macos-arm64/git-log-analyzer-darwin-arm64" ]; then
          spctl -a -t exec -vv macos-arm64/git-log-analyzer-darwin-arm64
        fi

    - name: Upload notarized macOS binaries
      uses: actions/upload-artifact@v4
      with:
        name: notarized-macos-binaries
        path: |
          dist/macos-amd64/git-log-analyzer-darwin-amd64
          dist/macos-arm64/git-log-analyzer-darwin-arm64

  release:
    needs: [build, notarize-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts/

    - name: Prepare release assets
      run: |
        mkdir -p release
        
        # 复制Linux二进制文件
        cp artifacts/binaries-linux-amd64/git-log-analyzer-linux-amd64 release/
        cp artifacts/binaries-linux-arm64/git-log-analyzer-linux-arm64 release/
        
        # 复制Windows二进制文件
        cp artifacts/binaries-windows-amd64/git-log-analyzer-windows-amd64.exe release/
        
        # 复制已公证的macOS二进制文件
        if [ -d "artifacts/notarized-macos-binaries" ]; then
          cp artifacts/notarized-macos-binaries/git-log-analyzer-darwin-amd64 release/
          cp artifacts/notarized-macos-binaries/git-log-analyzer-darwin-arm64 release/
        else
          # 如果公证失败，使用未公证的版本
          cp artifacts/binaries-darwin-amd64/git-log-analyzer-darwin-amd64 release/
          cp artifacts/binaries-darwin-arm64/git-log-analyzer-darwin-arm64 release/
        fi
        
        # 创建压缩包
        cd release
        for file in *; do
          if [[ "$file" == *"windows"* ]]; then
            zip "${file%.*}.zip" "$file"
          else
            tar -czf "${file}.tar.gz" "$file"
          fi
        done
        ls -la

    - name: Generate checksums
      run: |
        cd release
        sha256sum *.tar.gz *.zip > checksums.txt
        cat checksums.txt

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          release/*.tar.gz
          release/*.zip
          release/checksums.txt
        body: |
          ## Git Log Analyzer ${{ github.ref_name }}
          
          ### 下载说明
          
          - **macOS**: 下载 `git-log-analyzer-darwin-amd64.tar.gz` (Intel) 或 `git-log-analyzer-darwin-arm64.tar.gz` (Apple Silicon)
          - **Linux**: 下载 `git-log-analyzer-linux-amd64.tar.gz` 或 `git-log-analyzer-linux-arm64.tar.gz`  
          - **Windows**: 下载 `git-log-analyzer-windows-amd64.zip`
          
          ### macOS 安装
          
          macOS版本已通过Apple公证，可以安全运行：
          
          ```bash
          # 下载并解压
          tar -xzf git-log-analyzer-darwin-*.tar.gz
          
          # 赋予执行权限
          chmod +x git-log-analyzer-darwin-*
          
          # 运行
          ./git-log-analyzer-darwin-* --help
          ```
          
          ### 验证文件完整性
          
          下载 `checksums.txt` 文件并验证：
          
          ```bash
          sha256sum -c checksums.txt
          ```
          
          ### 更新日志
          
          请查看此版本的具体变更。
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
